<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>본그림자와 반그림자</title>
<style>
:root{--bg:#f4f4f2;--fg:#1c1c1c;--muted:#666;--card:#fff;--line:#d9d9d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--fg:#eee;--muted:#a8a8a4;--line:#3a3a38}}
:root[data-theme="dark"]{--bg:#1b1b1a;--fg:#eee;--muted:#a8a8a4;--line:#3a3a38}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
main{max-width:980px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.4rem;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--muted);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
svg{display:block;width:100%;height:auto;touch-action:manipulation}
.zone{cursor:pointer;transition:opacity .15s}
.dim .zone:not(.active){opacity:.35}
#tip{position:absolute;pointer-events:none;background:#fff;color:#111;border:2px solid #111;border-radius:8px;padding:6px 10px;font-size:.95rem;font-weight:700;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#info{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;min-height:5.2em}
#info b{font-size:1.05rem}
</style>

<style>
.site-back{display:inline-block;margin:0 0 12px;padding:7px 11px;border:1px solid #b8c4d2;border-radius:8px;
color:inherit;text-decoration:none;font-size:.92rem;background:rgba(255,255,255,.75)}
.site-back:hover{background:#e8eef6}
</style>
</head>
<body>
<main>\n<a class="site-back" href="../">← 일식과 월식 메뉴로 돌아가기</a>\n
<h1>본그림자와 반그림자</h1>
<p class="sub">큰 광원이 만드는 그림자입니다. 그림자 위에 마우스를 올려 보세요.</p>
<div class="card" id="card">
<svg id="svg" viewBox="0 0 970 550" role="img" aria-label="큰 광원, 물체, 본그림자와 반그림자 도식">
<defs>
<linearGradient id="pen" gradientUnits="userSpaceOnUse" x1="0" y1="50" x2="0" y2="500">
<stop offset="0" stop-color="#f1f1f1"/><stop offset=".5" stop-color="#555"/><stop offset="1" stop-color="#f1f1f1"/>
</linearGradient>
<marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f00"/></marker>
<clipPath id="clip"><rect width="970" height="550"/></clipPath>
<clipPath id="lClip"><circle cx="175" cy="275" r="172"/></clipPath>
<mask id="mVis" maskUnits="userSpaceOnUse" x="0" y="0" width="970" height="550"><rect width="970" height="550" fill="#fff"/><polygon id="wedgeK" fill="#000"/></mask>
<mask id="mHid" maskUnits="userSpaceOnUse" x="0" y="0" width="970" height="550"><rect width="970" height="550" fill="#000"/><polygon id="wedgeW" fill="#fff"/></mask>
</defs>
<rect width="970" height="550" fill="#fff"/>
<g clip-path="url(#clip)">
<polygon id="penPoly" class="zone" data-k="pen" fill="url(#pen)"/>
<g id="rays" stroke="#cfcfcf" stroke-width="1.2" fill="none"></g>
<polygon id="umbPoly" class="zone" data-k="umb" fill="#000"/>
</g>
<circle id="light" cx="175" cy="275" r="172" fill="#ffff99" stroke="#a39600" stroke-width="4"/>
<text x="175" y="282" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="700" font-size="48" fill="#000">광원</text>
<text x="175" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#333">Light Source</text>
<circle id="obj" cx="725" cy="275" r="85" fill="#666" stroke="#000" stroke-width="3"/>
<g id="vis" style="display:none;pointer-events:none">
<circle cx="175" cy="275" r="172" fill="#333" fill-opacity=".6" mask="url(#mHid)"/>
<line id="ray1" stroke="#e00" stroke-width="2.5" stroke-dasharray="9 7"/>
<line id="ray2" stroke="#e00" stroke-width="2.5" stroke-dasharray="9 7"/>
<circle id="pDot" r="6" fill="#fff" stroke="#000" stroke-width="3"/>
</g>
</svg>
<div id="tip"></div>
</div>
<div id="info"><span style="color:var(--muted)">그림자 영역에 마우스를 올리면 설명이 나타납니다.</span></div>
</main>
<script>
(function(){
  var C1={x:175,y:275},R=172,C2={x:725,y:275},r=85,d=C2.x-C1.x,L=1200;
  var svg=document.getElementById('svg'),card=document.getElementById('card'),tip=document.getElementById('tip'),info=document.getElementById('info');
  function pt(x,y){return x.toFixed(1)+','+y.toFixed(1)}
  // umbra (outer tangents, converge)
  var a=Math.asin((R-r)/d),ca=Math.cos(a),sa=Math.sin(a);
  var uT=[C2.x+r*sa,C2.y-r*ca],uB=[C2.x+r*sa,C2.y+r*ca];
  var uTe=[uT[0]+L*ca,uT[1]+L*sa],uBe=[uB[0]+L*ca,uB[1]-L*sa];
  document.getElementById('umbPoly').setAttribute('points',[pt(uT[0],uT[1]),pt(uTe[0],uTe[1]),pt(uBe[0],uBe[1]),pt(uB[0],uB[1])].join(' '));
  // penumbra (inner tangents, diverge)
  var b=Math.asin((R+r)/d),cb=Math.cos(b),sb=Math.sin(b);
  var pT=[C2.x-r*sb,C2.y-r*cb],pB=[C2.x-r*sb,C2.y+r*cb];
  var pTe=[pT[0]+L*cb,pT[1]-L*sb],pBe=[pB[0]+L*cb,pB[1]+L*sb];
  document.getElementById('penPoly').setAttribute('points',[pt(pT[0],pT[1]),pt(pTe[0],pTe[1]),pt(pBe[0],pBe[1]),pt(pB[0],pB[1])].join(' '));
  // thin guide rays from light edge to object edge
  var rays=document.getElementById('rays');
  function line(x1,y1,x2,y2){var l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);rays.appendChild(l)}
  line(C1.x+R*sa,C1.y-R*ca,uT[0],uT[1]);
  line(C1.x+R*sa,C1.y+R*ca,uB[0],uB[1]);
  line(C1.x-R*(-sb),C1.y-R*(-cb)*-1,pT[0],pT[1]); // placeholder, replaced below
  rays.removeChild(rays.lastChild);
  line(C1.x+R*sb,C1.y+R*cb,pT[0],pT[1]);
  line(C1.x+R*sb,C1.y-R*cb,pB[0],pB[1]);

  var data={
    umb:{ko:'본그림자',en:'umbra',txt:'광원의 모든 부분이 물체에 가려져 빛이 전혀 도달하지 못하는 가장 어두운 영역입니다.'},
    pen:{ko:'반그림자',en:'penumbra',txt:'광원의 일부만 가려져 빛이 일부만 도달하는 영역입니다. 본그림자 바깥쪽으로 갈수록 점점 밝아집니다.'}
  };
  var zones=svg.querySelectorAll('.zone');
  function show(k,ev){
    var m=data[k];
    tip.textContent=m.ko+' ('+m.en+')';
    tip.style.opacity=1;
    zones.forEach(function(z){z.classList.toggle('active',z.dataset.k===k)});
    svg.classList.add('dim');
    info.innerHTML='<b>'+m.ko+' ('+m.en+')</b><br>'+m.txt;
    move(ev);
    updateVis(k,ev);
  }
  function toSvg(ev){var p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;var q=p.matrixTransform(svg.getScreenCTM().inverse());return {x:q.x,y:q.y}}
  function setRay(id,P,ang){
    var ux=Math.cos(ang),uy=Math.sin(ang),fx=C1.x-P.x,fy=C1.y-P.y,tc=fx*ux+fy*uy,p2=fx*fx+fy*fy-tc*tc,t=tc;
    if(p2<R*R)t=tc+Math.sqrt(R*R-p2);
    var l=document.getElementById(id);
    l.setAttribute('x1',P.x);l.setAttribute('y1',P.y);l.setAttribute('x2',P.x+t*ux);l.setAttribute('y2',P.y+t*uy);
  }
  function blocked(P,x,y){
    var vx=x-P.x,vy=y-P.y,t=((C2.x-P.x)*vx+(C2.y-P.y)*vy)/(vx*vx+vy*vy);
    t=Math.max(0,Math.min(1,t));
    return Math.hypot(P.x+t*vx-C2.x,P.y+t*vy-C2.y)<r;
  }
  function updateVis(k,ev){
    var vis=document.getElementById('vis'),P=toSvg(ev);
    var dx=C2.x-P.x,dy=C2.y-P.y,D=Math.hypot(dx,dy);
    if(D<=r){vis.style.display='none';return}
    var th=Math.atan2(dy,dx),g=Math.asin(r/D),BIG=3000;
    var e1=[P.x+BIG*Math.cos(th-g),P.y+BIG*Math.sin(th-g)],e2=[P.x+BIG*Math.cos(th+g),P.y+BIG*Math.sin(th+g)];
    var wp=pt(P.x,P.y)+' '+pt(e1[0],e1[1])+' '+pt(e2[0],e2[1]);
    document.getElementById('wedgeK').setAttribute('points',wp);
    document.getElementById('wedgeW').setAttribute('points',wp);
    var dL=Math.hypot(C1.x-P.x,C1.y-P.y),thL=Math.atan2(C1.y-P.y,C1.x-P.x),del=Math.asin(R/dL);
    function wr(a){return Math.atan2(Math.sin(a),Math.cos(a))}
    var rc=wr(th-thL),r1=rc-g,r2=rc+g,c1=Math.abs(r1)<del,c2=Math.abs(r2)<del;
    var l1=document.getElementById('ray1'),l2=document.getElementById('ray2');
    if(k==='pen'&&c1!==c2){
      var objAng=thL+(c1?r1:r2),tanAng=thL+(c1?-del:del),tt=Math.sqrt(dL*dL-R*R);
      setRay('ray1',P,objAng);
      l2.setAttribute('x1',P.x);l2.setAttribute('y1',P.y);l2.setAttribute('x2',P.x+tt*Math.cos(tanAng));l2.setAttribute('y2',P.y+tt*Math.sin(tanAng));
      l1.style.display='';l2.style.display='';
    }else{l1.style.display='none';l2.style.display='none';}
    var dot=document.getElementById('pDot');dot.setAttribute('cx',P.x);dot.setAttribute('cy',P.y);
    vis.style.display='';
    var tot=0,vs=0,st=5;
    for(var x=C1.x-R;x<=C1.x+R;x+=st){for(var y=C1.y-R;y<=C1.y+R;y+=st){
      if((x-C1.x)*(x-C1.x)+(y-C1.y)*(y-C1.y)>R*R)continue;
      tot++;if(!blocked(P,x,y))vs++;
    }}
    var pct=Math.round(vs/tot*100),label=pct+'%';
    if(k==='pen'){if(pct<1)label='1% 미만';else if(pct>99)label='99% 이상';else label='약 '+label;}
    var extra='<br>이 지점에서 보이는 광원: <b>'+label+'</b>';
    if(k==='pen')extra+=' &mdash; 두 점선 사이가 이 지점에서 보이는 광원의 영역이고, 어두운 부분은 가려져 보이지 않습니다. 광원의 일부가 보이므로 완전히 어둡지 않습니다.';
    else extra+=' &mdash; 광원 전체가 가려져 있습니다.';
    info.innerHTML+=extra;
  }
  function move(ev){
    var rc=card.getBoundingClientRect();
    var cy=ev.clientY-rc.top,lower=cy>rc.height/2,x=ev.clientX-rc.left+30,y=lower?cy+30:cy-68;
    x=Math.min(Math.max(x,4),rc.width-tip.offsetWidth-4);
    y=Math.max(Math.min(y,rc.height-tip.offsetHeight-4),4);
    tip.style.left=x+'px';tip.style.top=y+'px';
  }
  function hide(){
    tip.style.opacity=0;svg.classList.remove('dim');document.getElementById('vis').style.display='none';
    zones.forEach(function(z){z.classList.remove('active')});
    info.innerHTML='<span style="color:var(--muted)">그림자 영역에 마우스를 올리면 설명이 나타납니다.</span>';
  }
  zones.forEach(function(z){
    z.addEventListener('pointerenter',function(e){show(z.dataset.k,e)});
    z.addEventListener('pointermove',function(e){show(z.dataset.k,e)});
    z.addEventListener('pointerleave',hide);
  });
})();
</script>
</body>
</html>
