<style>
:root{--bg:#fff;--fg:#1b1f2a;--card:#f3f4f8;--bd:#d5d8e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--fg:#e8eaf2;--card:#1f222c;--bd:#3a3f50}}
:root[data-theme="dark"]{--bg:#14161d;--fg:#e8eaf2;--card:#1f222c;--bd:#3a3f50}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.5}
main{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:1.3rem;margin:4px 0 10px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font-size:1rem;cursor:pointer}
.tabs button:disabled{opacity:.5;cursor:default}
.tabs button.on{background:#3b6cf6;color:#fff;border-color:#3b6cf6}
svg{width:100%;height:auto;display:block;border-radius:12px;background:#0b1026;touch-action:none}
[data-name]{cursor:pointer}
.ctl{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0}
@media(max-width:600px){.ctl{grid-template-columns:1fr}}
.ctl label{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:.9rem}
.ctl input{width:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.9rem;margin:6px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.note{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:.92rem}
#tip{position:fixed;pointer-events:none;background:#fff;color:#111;border-radius:8px;padding:5px 10px;font-weight:700;font-size:1rem;box-shadow:0 2px 8px #0006;display:none;z-index:9}
</style>
<style>

.site-back:hover{background:#e8eef6}
