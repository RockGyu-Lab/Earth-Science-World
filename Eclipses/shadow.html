<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>본그림자, 반그림자, 금환그림자</title>
<style>
:root{--bg:#f4f4f2;--fg:#1c1c1c;--muted:#666;--card:#fff;--line:#d9d9d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--fg:#eee;--muted:#a8a8a4;--line:#3a3a38}}
:root[data-theme="dark"]{--bg:#1b1b1a;--fg:#eee;--muted:#a8a8a4;--line:#3a3a38}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
main{max-width:700px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.4rem;margin:0 0 4px}
.back{display:inline-block;margin:0 0 14px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);font-size:.9rem;font-weight:700;text-decoration:none}
.back:hover{background:var(--line)}
p.sub{margin:0 0 14px;color:var(--muted);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.zone{cursor:pointer;transition:opacity .15s}
.dim .zone:not(.active){opacity:.35}
#tip{position:absolute;pointer-events:none;background:#fff;color:#111;border:2px solid #111;border-radius:8px;padding:6px 10px;font-size:.95rem;font-weight:700;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.ctl{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.ctl label{font-weight:700;display:block;margin-bottom:6px}
.ctl input[type=range]{width:100%;accent-color:#666}
.ctl .ends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.ctl p{margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.row{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
#info{flex:1 1 320px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;min-height:5.2em}
.skybox{flex:0 0 200px;height:200px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0f0f1e}
.skybox svg{display:block;width:200px;height:200px}
#info b{font-size:1.05rem}

/* ---- 학습실 공통 스타일 (Star/luminosity.html과 같은 규칙) ----
   색: 남색 하나를 기본 강조색으로 / 상자: 테두리 대신 옅은 회색 판 / 모서리: 판 14px, 버튼 10px
   그림(도식) 판은 흰 바탕에 맞춰 그려져 있어 어두운 모드에서도 흰 바탕을 유지 */
:root{--bg:#fff;--acc:#5468d4;--on-acc:#fff;--cd:#f3f4f8;--frame:#e3e6ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--acc:#8f9cf0;--on-acc:#10142b;--cd:#1f222c;--frame:#2c3247}}
:root[data-theme="dark"]{--bg:#14161d;--acc:#8f9cf0;--on-acc:#10142b;--cd:#1f222c;--frame:#2c3247}
body{font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;word-break:keep-all}
.card{border:0;border-radius:14px;box-shadow:0 0 0 1px var(--frame)}
.ctl,#info{border:0;border-radius:14px;background:var(--cd)}
.ctl input[type=range]{accent-color:var(--acc)}
.skybox{border:0;border-radius:14px;box-shadow:0 0 0 1px var(--frame)}
/* 제목 줄: [탐구 NN] 제목 …… [← 메뉴로 돌아가기]를 한 줄에 두어 세로 공간을 아낌 (좁은 화면에서는 줄바꿈) */
.titlebar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:0 0 10px}
.titlebar .back{margin:0 0 0 auto;flex:none}
.pnum{display:block;width:fit-content;margin:0 0 6px;padding:2px 10px;border-radius:999px;background:var(--acc);color:var(--on-acc);font-size:.8rem;font-weight:700;letter-spacing:.04em}
.titlebar .pnum{margin:0;flex:none}
.titlebar h1,header .titlebar h1{font-size:1.35rem;font-weight:800;line-height:1.35;margin:0;padding:0;border:0;text-wrap:balance}
</style>
<!-- 글꼴(Pretendard): 인터넷이 없으면 시스템 글꼴로 대신 표시되며 기능에는 영향 없음 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body>
<main>
<div class="titlebar"><p class="pnum">탐구 01</p><h1>본그림자, 반그림자, 금환그림자</h1><a class="back" href="./Eclipse_index.html">← [일식과 월식] 메뉴로 돌아가기</a></div>
<p class="sub">큰 광원이 만드는 그림자입니다. 그림자 위에 마우스를 올려 보세요.</p>
<div class="card" id="card">
<svg id="svg" viewBox="0 85 970 380" role="img" aria-label="큰 광원, 물체, 본그림자, 반그림자, 금환그림자 도식">
<defs>
<linearGradient id="pen" gradientUnits="userSpaceOnUse" x1="0" y1="75" x2="0" y2="475">
<stop offset="0" stop-color="#f1f1f1"/><stop offset=".5" stop-color="#555"/><stop offset="1" stop-color="#f1f1f1"/>
</linearGradient>
<linearGradient id="antG" gradientUnits="userSpaceOnUse" x1="1000" y1="0" x2="1400" y2="0">
<stop offset="0" stop-color="#151515"/><stop offset="1" stop-color="#7a7a7a"/>
</linearGradient>
<clipPath id="clip"><rect width="970" height="550"/></clipPath>
<radialGradient id="lightG" cx=".38" cy=".33" r=".85"><stop offset="0" stop-color="#ffffd0"/><stop offset=".55" stop-color="#ffff99"/><stop offset="1" stop-color="#e3d84f"/></radialGradient>
<radialGradient id="objG" cx=".38" cy=".33" r=".85"><stop offset="0" stop-color="#9a9a9a"/><stop offset=".6" stop-color="#666"/><stop offset="1" stop-color="#3c3c3c"/></radialGradient>
<radialGradient id="objS" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#2b2b2b"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="mVis" maskUnits="userSpaceOnUse" x="0" y="0" width="970" height="550"><rect width="970" height="550" fill="#fff"/><polygon id="wedgeK" fill="#000"/></mask>
<mask id="mHid" maskUnits="userSpaceOnUse" x="0" y="0" width="970" height="550"><rect width="970" height="550" fill="#000"/><polygon id="wedgeW" fill="#fff"/></mask>
</defs>
<rect width="970" height="550" fill="#fff"/>
<g clip-path="url(#clip)">
<polygon id="penPoly" class="zone" data-k="pen" fill="url(#pen)"/>
<g id="rays" stroke="#cfcfcf" stroke-width="1.2" fill="none"></g>
<polygon id="antPoly" class="zone" data-k="ant" fill="url(#antG)"/>
<polygon id="umbPoly" class="zone" data-k="umb" fill="#000"/>
</g>
<circle cx="140" cy="275" r="115" fill="url(#lightG)" stroke="#a39600" stroke-width="3"/>
<text x="140" y="281" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="700" font-size="32" fill="#000">광원</text>
<text x="140" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Light Source</text>
<circle id="obj" cx="500" cy="275" r="57" fill="url(#objG)" stroke="#000" stroke-width="3"/>
<g id="vis" style="display:none;pointer-events:none">
<circle cx="140" cy="275" r="115" fill="#333" fill-opacity=".6" mask="url(#mHid)"/>
<line id="ray1" stroke="#e00" stroke-width="2.5" stroke-dasharray="9 7"/>
<line id="ray2" stroke="#e00" stroke-width="2.5" stroke-dasharray="9 7"/>
<line id="ray3" stroke="#e00" stroke-width="2.5" stroke-dasharray="9 7"/>
<line id="ray4" stroke="#e00" stroke-width="2.5" stroke-dasharray="9 7"/>
<circle id="pDot" r="6" fill="#fff" stroke="#000" stroke-width="3"/>
</g>
</svg>
<div id="tip"></div>
</div>
<div class="ctl">
<label for="pos">물체의 위치</label>
<input type="range" id="pos" min="325" max="700" step="1" value="500">
<div class="ends"><span>광원에 가까움</span><span>광원에서 멂</span></div>
 
</div>
<div class="row">
<div id="info"><span style="color:var(--muted)">그림자 영역에 마우스를 올리면 설명이 나타납니다.</span></div>
<div class="skybox"><svg viewBox="0 0 240 240" role="img" aria-label="관측 지점에서 본 광원과 물체">
<circle cx="120" cy="130" r="60" fill="url(#lightG)"/>
<circle id="skyObj" cx="120" cy="130" r="50" fill="url(#objS)" stroke="#000" stroke-width="1.5" style="display:none"/>
<circle cx="120" cy="130" r="60" fill="none" stroke="#e00" stroke-width="2" stroke-dasharray="6 5"/>
<text x="120" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff" stroke="#0f0f1e" stroke-width="3" paint-order="stroke" font-family="'Noto Sans KR',sans-serif">관측 지점에서 보이는 광원의 모습</text>
</svg></div>
</div>
</main>
<script>
(function(){
  var C1={x:140,y:275},R=115,C2={x:500,y:275},r=57,L=3000;
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('svg'),card=document.getElementById('card'),tip=document.getElementById('tip'),info=document.getElementById('info');
  var rays=document.getElementById('rays'),obj=document.getElementById('obj'),slider=document.getElementById('pos');
  function pt(x,y){return x.toFixed(1)+','+y.toFixed(1)}
  function line(x1,y1,x2,y2){var l=document.createElementNS(NS,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);rays.appendChild(l)}
  function build(){
    var d=C2.x-C1.x;
    // umbra: outer tangents converge at the apex
    var a=Math.asin((R-r)/d),ca=Math.cos(a),sa=Math.sin(a);
    var uT=[C2.x+r*sa,C2.y-r*ca],uB=[C2.x+r*sa,C2.y+r*ca],ax=C2.x+r/sa;
    document.getElementById('umbPoly').setAttribute('points',[pt(uT[0],uT[1]),pt(ax,C2.y),pt(uB[0],uB[1])].join(' '));
    // antumbra: beyond the apex, the same lines diverge again
    document.getElementById('antPoly').setAttribute('points',[pt(ax,C2.y),pt(ax+L*ca,C2.y+L*sa),pt(ax+L*ca,C2.y-L*sa)].join(' '));
    var g=document.getElementById('antG');g.setAttribute('x1',ax);g.setAttribute('x2',ax+400);
    // penumbra: inner tangents diverge
    var b=Math.asin((R+r)/d),cb=Math.cos(b),sb=Math.sin(b);
    var pT=[C2.x-r*sb,C2.y-r*cb],pB=[C2.x-r*sb,C2.y+r*cb];
    var pTe=[pT[0]+L*cb,pT[1]-L*sb],pBe=[pB[0]+L*cb,pB[1]+L*sb];
    document.getElementById('penPoly').setAttribute('points',[pt(pT[0],pT[1]),pt(pTe[0],pTe[1]),pt(pBe[0],pBe[1]),pt(pB[0],pB[1])].join(' '));
    // thin guide lines
    while(rays.firstChild)rays.removeChild(rays.firstChild);
    line(C1.x+R*sa,C1.y-R*ca,uT[0],uT[1]);
    line(C1.x+R*sa,C1.y+R*ca,uB[0],uB[1]);
    line(C1.x+R*sb,C1.y+R*cb,pT[0],pT[1]);
    line(C1.x+R*sb,C1.y-R*cb,pB[0],pB[1]);
    obj.setAttribute('cx',C2.x);
  }
  build();

  var data={
    umb:{ko:'본그림자',en:'umbra',txt:'광원의 모든 부분이 물체에 가려져 빛이 전혀 도달하지 못하는 가장 어두운 영역입니다.'},
    pen:{ko:'반그림자',en:'penumbra',txt:'광원의 일부만 가려져 빛이 일부만 도달하는 영역입니다. 본그림자 바깥쪽으로 갈수록 점점 밝아집니다.'},
    ant:{ko:'금환그림자',en:'antumbra',txt:'물체가 광원보다 작게 보이는 영역입니다. 광원의 가운데는 물체에 가려지지만 양쪽 가장자리는 보이기 때문에 완전히 어둡지는 않습니다.'}
  };
  var zones=svg.querySelectorAll('.zone');
  function show(k,ev){
    var m=data[k];
    tip.textContent=m.ko+' ('+m.en+')';
    tip.style.opacity=1;
    zones.forEach(function(z){z.classList.toggle('active',z.dataset.k===k)});
    svg.classList.add('dim');
    info.innerHTML='<b>'+m.ko+' ('+m.en+')</b><br>'+m.txt;
    move(ev);
    updateVis(k,ev);
  }
  function toSvg(ev){var p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;var q=p.matrixTransform(svg.getScreenCTM().inverse());return {x:q.x,y:q.y}}
  function setRay(id,P,ang){
    var ux=Math.cos(ang),uy=Math.sin(ang),fx=C1.x-P.x,fy=C1.y-P.y,tc=fx*ux+fy*uy,p2=fx*fx+fy*fy-tc*tc,t=tc;
    if(p2<R*R)t=tc+Math.sqrt(R*R-p2);
    var l=document.getElementById(id);
    l.setAttribute('x1',P.x);l.setAttribute('y1',P.y);l.setAttribute('x2',P.x+t*ux);l.setAttribute('y2',P.y+t*uy);
  }
  function blocked(P,x,y){
    var vx=x-P.x,vy=y-P.y,t=((C2.x-P.x)*vx+(C2.y-P.y)*vy)/(vx*vx+vy*vy);
    t=Math.max(0,Math.min(1,t));
    return Math.hypot(P.x+t*vx-C2.x,P.y+t*vy-C2.y)<r;
  }
  function lens(a,b,d){
    if(d>=a+b)return 0;
    if(d<=Math.abs(a-b)){var m=Math.min(a,b);return Math.PI*m*m}
    var A=a*a*Math.acos((d*d+a*a-b*b)/(2*d*a)),B=b*b*Math.acos((d*d+b*b-a*a)/(2*d*b)),C=0.5*Math.sqrt((-d+a+b)*(d+a-b)*(d-a+b)*(d+a+b));
    return A+B-C;
  }
  function drawSky(del,g,rc){
    var sc=60,o=document.getElementById('skyObj');
    o.setAttribute('r',sc*g/del);o.setAttribute('cy',130-rc/del*sc);o.style.display='';
  }
  function updateVis(k,ev){
    var vis=document.getElementById('vis'),P=toSvg(ev);
    var dx=C2.x-P.x,dy=C2.y-P.y,D=Math.hypot(dx,dy);
    if(D<=r){vis.style.display='none';return}
    var th=Math.atan2(dy,dx),g=Math.asin(r/D),BIG=3000;
    var e1=[P.x+BIG*Math.cos(th-g),P.y+BIG*Math.sin(th-g)],e2=[P.x+BIG*Math.cos(th+g),P.y+BIG*Math.sin(th+g)];
    var wp=pt(P.x,P.y)+' '+pt(e1[0],e1[1])+' '+pt(e2[0],e2[1]);
    document.getElementById('wedgeK').setAttribute('points',wp);
    document.getElementById('wedgeW').setAttribute('points',wp);
    var dL=Math.hypot(C1.x-P.x,C1.y-P.y),thL=Math.atan2(C1.y-P.y,C1.x-P.x),del=Math.asin(R/dL);
    function wr(a){return Math.atan2(Math.sin(a),Math.cos(a))}
    var rc=wr(th-thL),r1=rc-g,r2=rc+g,c1=Math.abs(r1)<del,c2=Math.abs(r2)<del;
    var l1=document.getElementById('ray1'),l2=document.getElementById('ray2'),l3=document.getElementById('ray3'),l4=document.getElementById('ray4');
    l3.style.display='none';l4.style.display='none';
    if(k==='pen'&&c1!==c2){
      var objAng=thL+(c1?r1:r2),tanAng=thL+(c1?-del:del),tt=Math.sqrt(dL*dL-R*R);
      setRay('ray1',P,objAng);
      l2.setAttribute('x1',P.x);l2.setAttribute('y1',P.y);l2.setAttribute('x2',P.x+tt*Math.cos(tanAng));l2.setAttribute('y2',P.y+tt*Math.sin(tanAng));
      l1.style.display='';l2.style.display='';
    }else if(k==='ant'&&c1&&c2){
      var tt2=Math.sqrt(dL*dL-R*R);
      setRay('ray1',P,thL+r1);setRay('ray2',P,thL+r2);
      [[l3,thL-del],[l4,thL+del]].forEach(function(a){var l=a[0];l.setAttribute('x1',P.x);l.setAttribute('y1',P.y);l.setAttribute('x2',P.x+tt2*Math.cos(a[1]));l.setAttribute('y2',P.y+tt2*Math.sin(a[1]))});
      l1.style.display='';l2.style.display='';l3.style.display='';l4.style.display='';
    }else{l1.style.display='none';l2.style.display='none';}
    var dot=document.getElementById('pDot');dot.setAttribute('cx',P.x);dot.setAttribute('cy',P.y);
    vis.style.display='';
    var ov=lens(del,g,Math.abs(rc)),pct=Math.round((1-ov/(Math.PI*del*del))*100),label=pct+'%';
    drawSky(del,g,rc);
    if(k!=='umb'){if(pct<1)label='1% 미만';else if(pct>99)label='99% 이상';else label='약 '+label;}
    var extra='<br>이 지점에서 보이는 광원: <b>'+label+'</b>';
    if(k==='pen')extra+=' &mdash; 두 점선 사이의 밝은 부분이 관찰 가능한 광원의 영역이고, 어두운 부분은 가려져 보이지 않습니다.';
    else if(k==='ant')extra+=' &mdash; 안쪽 두 점선 사이는 물체에 가려지고(어두운 부분), 바깥쪽 점선 사이의 테두리만 관찰 가능합니다.';
    else extra+=' &mdash; 광원 전체가 가려져 있습니다.';
    info.innerHTML+=extra;
  }
  function move(ev){
    var rc=card.getBoundingClientRect();
    var cy=ev.clientY-rc.top,touch=ev.pointerType==='touch',lower=!touch&&cy>rc.height/2,x=touch?ev.clientX-rc.left-tip.offsetWidth/2:ev.clientX-rc.left+30,y=touch?cy-95:(lower?cy+30:cy-68);
    x=Math.min(Math.max(x,4),rc.width-tip.offsetWidth-4);
    y=Math.max(Math.min(y,rc.height-tip.offsetHeight-4),4);
    tip.style.left=x+'px';tip.style.top=y+'px';
  }
  function hide(){
    tip.style.opacity=0;svg.classList.remove('dim');document.getElementById('vis').style.display='none';document.getElementById('skyObj').style.display='none';
    zones.forEach(function(z){z.classList.remove('active')});
    info.innerHTML='<span style="color:var(--muted)">그림자 영역에 마우스를 올리면 설명이 나타납니다.</span>';
  }
  function handle(ev){
    var el=document.elementFromPoint(ev.clientX,ev.clientY),z=el&&el.closest?el.closest('.zone'):null;
    if(z)show(z.dataset.k,ev);else hide();
  }
  svg.addEventListener('pointerdown',handle);
  svg.addEventListener('pointermove',handle);
  svg.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')hide()});
  slider.addEventListener('input',function(){C2.x=+slider.value;build();hide();});
})();
</script>
<script src="../copyright.js"></script>
</body>
</html>

</body></html>
