<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여러 가지 스펙트럼</title>
<style>
:root{--bg:#fff;--fg:#1b1f2a;--card:#f3f4f8;--bd:#d5d8e2;--bline:#d9d9d6;--bcard:#fff;--bfg:#1c1c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#14161d;--fg:#e8eaf2;--card:#1f222c;--bd:#3a3f50;--bline:#3a3a38;--bcard:#262625;--bfg:#eee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.5}
main{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:1.3rem;margin:4px 0 10px}
.back{display:inline-block;margin:0 0 14px;padding:8px 14px;border:1px solid var(--bline);border-radius:999px;background:var(--bcard);color:var(--bfg);font-size:.9rem;font-weight:700;text-decoration:none}
.back:hover{background:var(--bline)}
.tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{flex:1;min-width:120px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font-size:.95rem;cursor:pointer}
#gasrow button{min-width:70px;padding:8px}
.gaswrap{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.gaswrap #gasrow{flex:1;margin:0}
.gpl{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:8px 12px;border-radius:10px;background:#3b6cf61a;border:1.5px dashed #3b6cf6;color:#3b6cf6;font-size:.92rem}
.gpl .arr{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.gpl .arr{animation:none}}
@media (max-width:640px){.gaswrap{flex-direction:column;align-items:stretch;gap:6px}.gpl .arr{transform:rotate(90deg);animation:none}}
#mtabs{display:grid;grid-template-columns:repeat(4,1fr)}
#mtabs button{min-width:0;white-space:nowrap;line-height:1.3;padding:8px 6px}
#mtabs small{display:block;font-size:.78rem;opacity:.75;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){#mtabs{grid-template-columns:repeat(2,1fr)}}
.tabs button.on{background:#3b6cf6;color:#fff;border-color:#3b6cf6}
svg{width:100%;height:auto;display:block;border-radius:12px;background:#0b1026;touch-action:none}
[data-name]{cursor:pointer}
.ctl{margin:10px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.row button{padding:6px 14px;font-size:.85rem;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
.row label{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:4px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer}
.fig{position:relative}
.ov{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.ov label{display:flex;align-items:center;gap:6px;font-size:.85rem;padding:4px 10px;border:1px solid #3a4260;border-radius:8px;background:#161c36cc;color:#e8eaf2;cursor:pointer}
@media (max-width:640px){.ov{top:5px;right:5px;gap:3px}.ov label{font-size:.62rem;padding:1px 6px;gap:4px}.ov input{width:11px;height:11px;margin:0}}
#ans{font-size:1rem;color:#e5484d}
#trow{margin:14px 0 16px;padding:14px 16px;gap:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
#trow .qmsg{font-size:.95rem;font-weight:600;margin-right:6px}
#trow .tend{font-size:.8rem;opacity:.7}
#trow input{flex:1;min-width:140px;max-width:320px;accent-color:#3b6cf6}
#trow #tpv{min-width:70px;font-size:1rem;color:#d9822b}
@media (max-width:640px){#trow .qmsg{flex-basis:100%}}
#qrow{margin:14px 0 16px;padding:14px 16px;gap:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
#qrow .qmsg{font-size:.95rem;font-weight:600}
#qrow button{padding:10px 18px;font-size:.92rem;background:var(--bg)}
@media (max-width:640px){#qrow .qmsg{flex-basis:100%}}
.note{margin-bottom:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;font-size:.92rem}
.note .nh{font-weight:700;color:#3b6cf6}
.note .q{margin-top:8px}
.note p{margin:2px 0 0 1.3em}
#tip{position:fixed;pointer-events:none;background:#fff;color:#111;border-radius:8px;padding:5px 10px;font-weight:700;font-size:1rem;box-shadow:0 2px 8px #0006;display:none;z-index:9;white-space:nowrap}

/* ---- 별의 물리량 학습실 공통 스타일 (luminosity.html과 같은 규칙) ----
   색: 남색 하나를 기본 강조색으로, 온도 값은 호박색 / 상자: 테두리 대신 옅은 회색 판 / 모서리: 판 14px, 버튼 10px */
:root{--acc:#5468d4;--acc-bg:#eef0fc;--acc-bd:#c3caf2;--on-acc:#fff;--en:#b36b00;--frame:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#8f9cf0;--acc-bg:#1e2340;--acc-bd:#3d4680;--on-acc:#10142b;--en:#f5b942;--frame:#2c3247}}
:root[data-theme="dark"]{--acc:#8f9cf0;--acc-bg:#1e2340;--acc-bd:#3d4680;--on-acc:#10142b;--en:#f5b942;--frame:#2c3247}
body{font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Noto Sans KR",sans-serif;word-break:keep-all}
button,input{font-family:inherit}
.tabs button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:700}
svg{border-radius:14px;box-shadow:0 0 0 1px var(--frame)}
.note,#trow,#qrow{border:0;border-radius:14px;background:var(--card)}
.note .nh{color:var(--acc)}
.note p{margin:4px 0 0}
.row button,.row label{border-radius:10px}
#trow input{accent-color:var(--acc)}
#trow #tpv{color:var(--en)}
#qrow button{border-color:transparent;box-shadow:0 1px 2px rgba(20,25,45,.12)}
#qrow button:hover{border-color:var(--acc)}
#qrow #chk{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}
#ans{color:var(--acc)}
.gpl{background:var(--acc-bg);border:1px solid var(--acc-bd);color:var(--acc)}
/* 탭을 바꿀 때 내용이 살짝 떠오르며 나타남 */
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.enter{animation:enter .28s ease-out}
@media (prefers-reduced-motion:reduce){.enter{animation:none}}
</style>

<h1>여러 가지 스펙트럼</h1>
<div class="tabs" id="mtabs"><button id="t1" class="on">① 연속 스펙트럼<small>뜨거운 고체</small></button><button id="t3">② 방출 스펙트럼<small>뜨거운 기체</small></button><button id="t2">③ 흡수 스펙트럼<small>고체 + 차가운 기체</small></button><button id="t4">④ 별의 스펙트럼<small>태양</small></button></div>
<div class="note" id="note"></div>
<div class="fig"><svg id="sv" viewBox="0 0 900 500"></svg>
<div class="ov">
<label id="glab"><input type="checkbox" id="guide"> 선의 위치 맞춰 보기</label>
</div></div>
<div class="ctl">
<div class="row" id="trow"><span class="qmsg">광원(뜨거운 고체)의 온도를 바꿔 보세요.</span><span class="tend">3000 K</span><input id="tp" type="range" min="3000" max="12000" step="100" value="6000"><span class="tend">12000 K</span><b id="tpv">6000 K</b></div>
<div class="gaswrap" id="gaswrap"><div class="gpl"><b id="gpl"></b><span class="arr">▶</span></div><div class="tabs" id="gasrow"><button data-g="H" class="on">수소</button><button data-g="He">헬륨</button><button data-g="Ca">칼슘</button><button data-g="Fe">철</button><button data-g="?">혼합 기체 ?</button></div></div>
<div class="row" id="qrow"><span class="qmsg">혼합 기체의 종류를 추정한 후 정답을 확인해 보세요.</span><button id="chk">정답 확인</button><button id="nxt">다른 혼합 기체로 바꾸기</button><b id="ans"></b></div>
</div>

<script>
const NS="http://www.w3.org/2000/svg",sv=document.getElementById('sv'),tip=document.getElementById('tip');
const X0=120,X1=860,L0=380,L1=700,TOP=282,SH=56,RY=404,RH=30,RG=12;
let svH=500;const T0=6000;const LT=()=>M==1?+tp.value:T0;
const xOf=l=>X0+(l-L0)/(L1-L0)*(X1-X0),lOf=x=>L0+(x-X0)/(X1-X0)*(L1-L0);
// 원소별 가시광선 영역 방출선 [파장(nm), 상대 세기, 이름]
const GAS={
H:{n:'수소',s:'H',tube:'#ff6fa8',L:[[410.2,.35,'Hδ'],[434.0,.5,'Hγ'],[486.1,.75,'Hβ'],[656.3,1,'Hα']]},
He:{n:'헬륨',s:'He',tube:'#ffb48a',L:[[388.9,.6],[402.6,.3],[447.1,.7],[471.3,.35],[492.2,.35],[501.6,.6],[587.6,1],[667.8,.6]]},
Ca:{n:'칼슘',s:'Ca',tube:'#ff9a7a',L:[[393.4,1,'K'],[396.8,1,'H'],[422.7,.8],[445.5,.4],[558.9,.3],[612.2,.45],[616.2,.45],[643.9,.4],[646.3,.3]]},
Mg:{n:'마그네슘',s:'Mg',tube:'#a6f5b8',L:[[383.8,.6],[448.1,.35],[470.3,.3],[516.7,.8,'b'],[517.3,.9,'b'],[518.4,1,'b'],[552.8,.5]]},
Fe:{n:'철',s:'Fe',tube:'#c9ccff',L:[[382.0,.7],[385.9,.7],[404.6,.6],[406.4,.5],[427.2,.5],[430.8,.6],[432.6,.6],[438.4,.7],[440.5,.5],[466.8,.3],[489.1,.3],[495.8,.4],[527.0,.6],[532.8,.5],[537.1,.4],[543.0,.3],[561.6,.3]]}};
// 태양의 주요 흡수선(프라운호퍼선)
const SUN=[[382.0,.6,'철'],[385.9,.6,'철'],[393.4,1,'칼슘'],[396.8,1,'칼슘'],[404.6,.5,'철'],[410.2,.4,'수소 Hδ'],[422.7,.6,'칼슘'],[430.8,.7,'철·탄화수소'],[434.0,.5,'수소 Hγ'],[438.4,.4,'철'],[486.1,.8,'수소 Hβ'],[516.7,.5,'마그네슘'],[517.3,.5,'마그네슘'],[518.4,.6,'마그네슘'],[495.8,.4,'철'],[527.0,.5,'철'],[532.8,.4,'철'],[589.0,.9,'나트륨'],[589.6,.85,'나트륨'],[656.3,.9,'수소 Hα'],[686.7,.6,'산소 (지구 대기)']];
const UNK=['H','He','Ca','Fe'];
const MIX=()=>({n:unk.map(k=>GAS[k].n).join(' + '),tube:'#e6b3ff',L:unk.flatMap(k=>GAS[k].L)});
let M=1,gas='H',unk=[],rev=false;
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||sv).appendChild(e);return e}
function lab(x,y,t,fs=13,an='middle',fill='#fff'){const e=el('text',{x,y,fill,'font-size':fs,'text-anchor':an,'font-weight':600,stroke:'#0b1026','stroke-width':3,'paint-order':'stroke'});e.textContent=t;return e}
// 파장 → 색
function wl(l){let r=0,g=0,b=0;
 if(l<440){r=(440-l)/60;b=1}else if(l<490){g=(l-440)/50;b=1}else if(l<510){g=1;b=(510-l)/20}else if(l<580){r=(l-510)/70;g=1}else if(l<645){r=1;g=(645-l)/65}else r=1;
 const f=l<420?.3+.7*(l-380)/40:l>645?.3+.7*(700-l)/55:1;
 return[r,g,b].map(c=>Math.pow(Math.max(0,c*f),.8))}
const rgb=(l,i=1)=>'rgb('+wl(l).map(c=>Math.round(255*c*i)).join(',')+')';
// 플랑크 법칙: 온도에 따른 파장별 밝기 (가시광선 영역 최댓값 = 1)
const pl=(l,T)=>1/(l**5*(Math.exp(1.4388e7/(l*T))-1));
// 연속 스펙트럼 탭: 온도 간 비교가 되도록 12000 K 최댓값을 기준으로 한 절대 밝기 (로그 눈금으로 압축)
let REF=0;for(let l=L0;l<=L1;l+=2)REF=Math.max(REF,pl(l,12000));
const Iabs=T=>l=>Math.max(0,Math.min(1,(Math.log10(pl(l,T)/REF)+5)/5));
const IF=T=>M==1?Iabs(T):Ifn(T);
function Ifn(T){let m=0;for(let l=L0;l<=L1;l+=2)m=Math.max(m,pl(l,T));return l=>Math.pow(pl(l,T)/m,.6)}
// 온도 → 광원의 겉보기 색
function kc(T){const t=T/100,c=v=>Math.round(Math.max(0,Math.min(255,v)));
 const r=t<=66?255:329.7*Math.pow(t-60,-.1332),g=t<=66?99.47*Math.log(t)-161.12:288.12*Math.pow(t-60,-.0755),b=t>=66?255:t<=19?0:138.52*Math.log(t-10)-305.04;
 return`rgb(${c(r)},${c(g)},${c(b)})`}
const G=()=>gas=='?'?MIX():GAS[gas];
const gname=()=>gas=='?'?(rev?MIX().n:'혼합 기체 ?'):GAS[gas].n;
function cur(){if(M==1)return{type:'c',T:LT(),L:[]};
 if(M==2)return{type:'a',T:T0,L:G().L};
 if(M==3)return{type:'e',L:G().L};
 return{type:'a',T:5800,L:SUN}}
function obsName(l,t){const w=l.toFixed(1)+' nm';
 if(M==4)return`흡수선 ${w} (${t})`;
 const k=M==2?'흡수선':'방출선';return gas=='?'?`${k} ${w}`:`${GAS[gas].n} ${k} ${w}`}
function strip(y,h,o,nm,id){
 if(o.type=='e')el('rect',{x:X0,y,width:X1-X0,height:h,fill:'#000'});
 else{const I=IF(o.T),d=el('defs',{}),g=el('linearGradient',{id,gradientUnits:'userSpaceOnUse',x1:X0,x2:X1,y1:0,y2:0},d);
  for(let l=L0;l<=L1;l+=4)el('stop',{offset:((l-L0)/(L1-L0)).toFixed(4),'stop-color':rgb(l,I(l))},g);
  el('rect',{x:X0,y,width:X1-X0,height:h,fill:`url(#${id})`});}
 o.L.forEach(([l,s,t])=>{if(l<L0||l>L1)return;const x=xOf(l);
  if(o.type=='e'){el('rect',{x:x-4,y,width:8,height:h,fill:rgb(l),opacity:.5*s,filter:'url(#gl2)'});el('rect',{x:x-1.4,y,width:2.8,height:h,fill:rgb(l,Math.min(1,.45+.75*s))})}
  else el('rect',{x:x-1.3,y,width:2.6,height:h,fill:'#000',opacity:.45+.55*s});
  el('rect',{x:x-5,y,width:10,height:h,fill:'transparent','data-name':nm(l,t)})});
 el('rect',{x:X0,y,width:X1-X0,height:h,fill:'none',stroke:'#667','stroke-width':1})}
function bulb(x,y,T){const c=kc(T);
 el('circle',{cx:x,cy:y,r:46,fill:c,opacity:.55,filter:'url(#gl)'});
 el('circle',{cx:x,cy:y,r:27,fill:c,stroke:'#fff','stroke-opacity':.6});
 el('path',{d:`M${x-10} ${y+4} l5 -8 l5 8 l5 -8 l5 8`,stroke:'#fff',opacity:.8,fill:'none','stroke-width':1.5});
 el('rect',{x:x-11,y:y+25,width:22,height:18,rx:3,fill:'#bdb79a'});
 el('ellipse',{cx:x,cy:y+46,rx:30,ry:8,fill:'#9e9878'})}
function scene(o){
 const d=el('defs',{});
 const f=el('filter',{id:'gl',x:'-60%',y:'-60%',width:'220%',height:'220%'},d);el('feGaussianBlur',{stdDeviation:8},f);
 const f2=el('filter',{id:'gl2',x:'-150%',y:'-10%',width:'400%',height:'120%'},d);el('feGaussianBlur',{stdDeviation:2},f2);
 const f3=el('filter',{id:'gl3',x:'-60%',y:'-60%',width:'220%',height:'220%'},d);el('feGaussianBlur',{stdDeviation:4},f3);
 const pg=el('linearGradient',{id:'pg',x1:0,x2:1,y1:0,y2:1},d);[[0,'#f4f6fa'],[1,'#8f97a6']].forEach(([a,c])=>el('stop',{offset:a,'stop-color':c},pg));
 const sg=el('radialGradient',{id:'sg',cx:'45%',cy:'42%',r:'60%'},d);[[0,'#fffbe8'],[.6,'#ffd25a'],[1,'#f29a2e']].forEach(([a,c])=>el('stop',{offset:a,'stop-color':c},sg));
 // 빛줄기: 광원 → 슬릿 → 프리즘
 const sx=M==3?182:M==4?176:126,bc=M==3?G().tube:'#fff';
 el('polygon',{points:`${sx},92 300,104 300,116 ${sx},128`,fill:bc,opacity:.22});
 el('polygon',{points:`304,104 437,99 437,121 304,116`,fill:bc,opacity:.3});
 // 분산된 빛 (프리즘 → 스크린)
 const P=[474,168];
 if(o.type=='e')o.L.forEach(([l,s])=>{if(l<L0||l>L1)return;el('line',{x1:P[0],y1:P[1],x2:xOf(l),y2:TOP,stroke:rgb(l),'stroke-width':1.6,opacity:.35+.55*s})});
 else{const I=IF(o.T);for(let l=L0;l<=L1;l+=5)el('line',{x1:P[0],y1:P[1],x2:xOf(l),y2:TOP,stroke:rgb(l),'stroke-width':2,opacity:.35*I(l)})}
 // 광원
 if(M==1||M==2){bulb(98,108,LT());lab(M==1?110:98,184,'뜨거운 고체',13);lab(M==1?110:98,200,'(전구 필라멘트)',12);lab(M==1?110:98,218,LT()+' K',13,'middle','#f5b942')}
 if(M==2){[[-24,-16,26],[12,-24,22],[24,8,26],[-12,20,24],[0,0,28]].forEach(([a,b,r])=>el('circle',{cx:220+a,cy:110+b,r,fill:'#8fb0dc',opacity:.32,filter:'url(#gl3)'}));
  lab(222,184,'차가운 기체',13);lab(222,200,gname(),13,'middle','#9fd0ff')}
 if(M==3){const c=G().tube;
  el('rect',{x:40,y:92,width:140,height:36,rx:18,fill:c,opacity:.9,filter:'url(#gl)'});
  el('rect',{x:46,y:98,width:128,height:24,rx:12,fill:c});
  el('rect',{x:56,y:101,width:108,height:5,rx:2.5,fill:'#fff',opacity:.4});
  el('rect',{x:28,y:102,width:14,height:16,rx:2,fill:'#8a8f9c'});el('rect',{x:178,y:102,width:14,height:16,rx:2,fill:'#8a8f9c'});
  lab(110,184,'뜨거운 기체 (방전관)',13);lab(110,200,gname(),13,'middle','#ffd0e0')}
 if(M==4){el('circle',{cx:100,cy:112,r:76,fill:'#ffcc66',opacity:.22});
  el('circle',{cx:100,cy:112,r:76,fill:'none',stroke:'#ffe2a0','stroke-dasharray':'4 4',opacity:.7});
  el('circle',{cx:100,cy:112,r:60,fill:'url(#sg)'});
  lab(100,116,'뜨거운 내부',12,'middle','#7a3c00').setAttribute('stroke','none');
  lab(112,208,'내부(뜨겁고 밀도 높음) → 연속',12);lab(112,224,'대기(상대적으로 차가움) → 흡수',12,'middle','#ffe2a0')}
 // 슬릿, 프리즘
 el('rect',{x:296,y:40,width:8,height:62,fill:'#8a8f9c'});el('rect',{x:296,y:118,width:8,height:62,fill:'#8a8f9c'});lab(300,30,'슬릿',12);
 el('polygon',{points:'410,62 542,62 476,178',fill:'url(#pg)',opacity:.92,stroke:'#dde'});
 const pt=el('text',{x:476,y:92,fill:'#333','font-size':14,'font-weight':700,'text-anchor':'middle'});pt.textContent='프리즘'}
function draw(){
 sv.innerHTML='';const o=cur();
 const refs=M==1?[]:['H','He','Ca','Fe'];
 svH=M==1?TOP+SH+40:RY+refs.length*(RH+RG)+2;sv.setAttribute('viewBox',`0 0 900 ${svH}`);
 scene(o);
 strip(TOP,SH,o,obsName,'og');
 lab(X0-12,TOP+24,'관측된',13,'end');lab(X0-12,TOP+42,'스펙트럼',13,'end');
 const ay=TOP+SH;
 for(let l=400;l<=700;l+=50){const x=xOf(l);el('line',{x1:x,y1:ay,x2:x,y2:ay+6,stroke:'#aab'});lab(x,ay+21,l,12)}
 lab(X1+22,ay+21,'nm',12);
 if(M!=1)lab(X0,RY-12,'비교용 방출 스펙트럼 (실험실에서 측정한 원소별 방출선)',13,'start','#cfd6ea');
 const ansK=gas=='?'&&rev&&(M==2||M==3)?unk:[];
 refs.forEach((k,i)=>{const y=RY+i*(RH+RG),g=GAS[k];
  strip(y,RH,{type:'e',L:g.L},(l,t)=>`${g.n}${t?' '+t:''} ${l.toFixed(1)} nm`,'r'+k);
  lab(X0-12,y+20,`${g.n} (${g.s})`,13,'end');
  if(ansK.includes(k))el('rect',{x:X0-3,y:y-3,width:X1-X0+6,height:RH+6,rx:4,fill:'none',stroke:'#ffd84a','stroke-width':2.5})});
 if(guide.checked&&M!=1)o.L.forEach(([l])=>{if(l<L0||l>L1)return;const x=xOf(l);
  el('line',{x1:x,y1:TOP-4,x2:x,y2:svH-4,stroke:'#fff','stroke-width':1,'stroke-dasharray':'3 4',opacity:.6,'pointer-events':'none'})});
}
const NT=(t,d,q)=>`<div class="nh">${t}</div><p>${d}</p>`+(q?`<div class="nh q">생각해 보기</div><p>${q}</p>`:'');
const NOTE={
1:NT('연속 스펙트럼','뜨거운 고체나 밀도가 높은 기체는 모든 파장의 빛을 내므로, 무지개처럼 끊어짐 없는 스펙트럼이 나타납니다.'),
2:NT('흡수 스펙트럼','연속 스펙트럼을 내는 광원 앞에 차가운 기체가 있으면, 기체가 자신만의 특정 파장 빛을 흡수하여 검은 선(흡수선)이 생깁니다.'),
3:NT('방출 스펙트럼','뜨거운 기체(방전관)는 특정 파장의 빛만 내므로 검은 바탕에 밝은 선(방출선)이 나타납니다. 원소마다 선의 위치가 달라서 \'원소의 지문\'처럼 쓰입니다.'),
4:NT('별(태양)의 스펙트럼','별 내부의 뜨겁고 밀도 높은 부분은 연속 스펙트럼을 내고, 바깥쪽의 상대적으로 차가운 대기가 특정 파장을 흡수하여 흡수 스펙트럼이 나타납니다. 선 위에 손가락(마우스)을 올리면 어떤 원소인지 볼 수 있습니다.')};
function setMode(k){M=k;[t1,t2,t3,t4].forEach((b,i)=>b.className=i+1==k?'on':'');
 gpl.textContent=k==3?'방전관에 넣을 기체를 선택하세요':'광원 앞에 둘 기체를 선택하세요';
 gaswrap.style.display=k==2||k==3?'':'none';
 trow.style.display=k==1?'':'none';
 qrow.style.display=(k==2||k==3)&&gas=='?'?'':'none';
 glab.style.display=k>1?'':'none';
 note.innerHTML=NOTE[k];draw()}
function pick(){const old=unk.join();let n;do{n=UNK.filter(()=>Math.random()<.5)}while(n.length<2||n.length>3||n.join()==old);unk=n;rev=false;ans.textContent=''}
document.querySelectorAll('#gasrow button').forEach(b=>b.onclick=()=>{
 gas=b.dataset.g;document.querySelectorAll('#gasrow button').forEach(x=>x.className=x==b?'on':'');
 if(gas=='?')pick();setMode(M)});
chk.onclick=()=>{rev=true;ans.textContent='정답: '+MIX().n;draw()};
nxt.onclick=()=>{pick();draw()};
tp.oninput=()=>{tpv.textContent=tp.value+' K';draw()};
// 탭을 바꿀 때만 설명과 그림이 살짝 떠오르며 나타나게 함 (기체 선택 때는 그대로)
const fig=document.querySelector('.fig'),tab=k=>{setMode(k);[note,fig].forEach(e=>{e.classList.remove('enter');void e.offsetWidth;e.classList.add('enter')})};
t1.onclick=()=>tab(1);t2.onclick=()=>tab(2);t3.onclick=()=>tab(3);t4.onclick=()=>tab(4);
guide.onchange=draw;
function show(e){const n=e.target.closest&&e.target.closest('[data-name]');let s='';
 if(n)s=n.getAttribute('data-name');
 else{const p=sv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(sv.getScreenCTM().inverse());
  if(q.x>=X0&&q.x<=X1&&q.y>=TOP&&q.y<=svH)s='파장 ≈ '+Math.round(lOf(q.x))+' nm'}
 if(s){tip.textContent=s;tip.style.display='block';
  tip.style.left=Math.max(4,Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(e.clientY-40)+'px'}else tip.style.display='none'}
sv.addEventListener('pointermove',show);sv.addEventListener('pointerdown',show);
sv.addEventListener('pointerleave',()=>tip.style.display='none');
setMode(1);
</script></main></body></html>
